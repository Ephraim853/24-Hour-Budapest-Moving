<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--blue:#0B2A5B;--blue2:#16407F;--bg:#F4F6F9;--card:#fff;--line:#DDE3EC;--ink:#14213D;--mute:#5A6785;--cta:#FF7A1A;--ctaink:#14213D;--ok:#0E8A6B;--bad:#B3261E;--wa:#1FAF55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1426;--card:#122241;--line:#27395F;--ink:#EEF2FA;--mute:#9DAAC8;--blue:#07142C}}
:root[data-theme="dark"]{--bg:#0A1426;--card:#122241;--line:#27395F;--ink:#EEF2FA;--mute:#9DAAC8;--blue:#07142C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei","PingFang SC",sans-serif}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
header{background:var(--blue);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.logo{font-weight:900;font-size:1.1rem}.logo b{color:var(--cta)}
main{max-width:860px;margin:-12px auto 30px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 20px rgba(11,42,91,.08)}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--cta);outline-offset:2px;border-color:var(--blue2)}
.err{color:var(--bad);font-weight:700;min-height:1.3em;margin:6px 0}.err:not(:empty){animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .2s;text-decoration:none;display:inline-block}
.btn:active{transform:scale(.97)}
.cta{background:var(--cta);color:var(--ctaink);box-shadow:0 4px 0 #C85A0A;position:relative;overflow:hidden}.cta:hover{transform:translateY(-1px)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}.sm{padding:8px 12px;font-size:.88rem;border-radius:9px}
.btn.w{background:var(--wa);color:#fff;box-shadow:0 4px 0 #14803D}.btn.ig{background:#C13584;color:#fff}.btn.em{background:var(--blue2);color:#fff}
.meta{color:var(--mute);font-size:.92rem}
footer{background:var(--blue);color:#C9D6F0;padding:22px 20px;text-align:center;font-size:.92rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;transition:transform .3s;z-index:9;max-width:90vw}#toast.on{transform:translate(-50%,0)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:1.8rem;color:var(--blue2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.chip[aria-pressed="true"]{background:var(--blue2);border-color:var(--blue2);color:#fff}
.req{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;animation:rise .3s ease both}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;color:#fff;margin-left:6px}.s-new{background:var(--blue2)}.s-confirmed{background:var(--ok)}.s-done{background:#5A6785}.s-declined{background:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lg{max-width:440px;margin:32px auto}.lg h2{margin-bottom:6px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:.82rem;font-weight:700;background:transparent;border:0;color:var(--blue2);cursor:pointer;padding:8px}
.lgbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.88rem;color:var(--mute)}
</style>
</head>
<body>
<header>
<div class="logo">24 Hour <b>Budapest</b> Moving &middot; Team</div>
</header>
<section id="v-login"><main><div class="card lg">
<h2>Team sign-in</h2><p class="meta" style="margin:0">Only the two team members can open the dashboard.</p>
<div id="lgMsg" class="meta" style="margin:12px 0"></div>
<label for="lgE">Team email</label><input id="lgE" type="email" autocomplete="username" placeholder="name@gmail.com">
<label for="lgP" style="margin-top:10px">Password</label><div class="pw"><input id="lgP" type="password" autocomplete="current-password"><button type="button" id="lgS">Show</button></div>
<div class="err" id="lgErr" role="alert"></div>
<div class="nav" style="margin-top:14px"><span></span><button type="button" class="btn cta" id="lgGo">Sign in</button></div>
</div></main></section>
<section id="v-admin" hidden><main style="margin-top:24px"><div class="card">
<div class="lgbar"><span id="who"></span><span><button type="button" class="btn ghost sm" id="rf">Refresh</button> <button type="button" class="btn ghost sm" id="lgOut">Sign out</button></span></div>
<h2 style="margin-bottom:12px">Requests dashboard</h2>
<div class="stats"><div class="stat"><b id="sNew">0</b>New</div><div class="stat"><b id="sConf">0</b>Confirmed</div><div class="stat"><b id="sToday">0</b>Today</div></div>
<div class="chips" id="chips"></div><div id="list"></div>
</div></main></section>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
/* ===== SUPABASE (public values, safe to keep in the page) ===== */
var SUPABASE_URL="https://todhktlwtdqzedqxeabm.supabase.co",SUPABASE_ANON_KEY="sb_publishable__GYadVYPbyTYjgwAepPtdQ_PjJ_C6j1";
/* ===== EMAILJS (automatic customer emails) - fill these 3 in =====
   Get them at emailjs.com: Email Services -> Service ID, Email Templates -> Template ID, Account -> Public Key */
var EMAILJS_SERVICE_ID="YOUR_SERVICE_ID",EMAILJS_TEMPLATE_ID="YOUR_TEMPLATE_ID",EMAILJS_PUBLIC_KEY="YOUR_PUBLIC_KEY";
/* ================================================================ */
var $=function(s){return document.querySelector(s)},$$=function(s){return[].slice.call(document.querySelectorAll(s))};
var esc=function(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
var sb=null,reqs=[],filter="all",fails=0,lockUntil=0,idleT=null,pollT=null,toastT=null,IDLE=15*60*1000;
if(SUPABASE_URL.indexOf("http")===0&&window.supabase){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}})}
function view(signed){$("#v-admin").hidden=!signed;$("#v-login").hidden=signed;window.scrollTo(0,0)}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("on")},4500)}
var M={
en:{new:["We received your request – 24 Hour Budapest Moving","Hi {n},\n\nThank you! We have received your moving request and will review it shortly. We'll get back to you soon.\n\n24 Hour Budapest Moving"],declined:["Update on your request – 24 Hour Budapest Moving","Hi {n},\n\nThank you for your request. Unfortunately we are not able to take this job. We're sorry for the inconvenience and hope to help you another time.\n\n24 Hour Budapest Moving"],confirmed:["Your move is confirmed – 24 Hour Budapest Moving","Hi {n},\n\nGood news: your move is confirmed. We'll arrive at the agreed time. Message us if anything changes.\n\n24 Hour Budapest Moving"],done:["Your move is complete – 24 Hour Budapest Moving","Hi {n},\n\nYour move is complete. Thank you for choosing us! We hope everything went smoothly.\n\n24 Hour Budapest Moving"]},
hu:{new:["Megkaptuk a kérését – 24 Hour Budapest Moving","Kedves {n}!\n\nKöszönjük! Megkaptuk a költöztetési kérését, és hamarosan átnézzük. Rövidesen jelentkezünk.\n\n24 Hour Budapest Moving"],declined:["Tájékoztatás a kéréséről – 24 Hour Budapest Moving","Kedves {n}!\n\nKöszönjük a megkeresését. Sajnos ezt a munkát nem tudjuk vállalni. Elnézést kérünk a kellemetlenségért, és reméljük, hogy máskor segíthetünk.\n\n24 Hour Budapest Moving"],confirmed:["Költöztetése visszaigazolva – 24 Hour Budapest Moving","Kedves {n}!\n\nJó hír: a költöztetését visszaigazoltuk. A megbeszélt időpontban érkezünk. Ha bármi változik, írjon nekünk.\n\n24 Hour Budapest Moving"],done:["Költöztetése befejeződött – 24 Hour Budapest Moving","Kedves {n}!\n\nA költöztetés befejeződött. Köszönjük, hogy minket választott! Reméljük, minden rendben ment.\n\n24 Hour Budapest Moving"]},
zh:{new:["我们已收到您的请求 – 24 Hour Budapest Moving","{n}，您好！\n\n感谢您的联系！我们已收到您的搬家请求，将尽快审核并回复您。\n\n24 Hour Budapest Moving"],declined:["关于您的请求的通知 – 24 Hour Budapest Moving","{n}，您好！\n\n感谢您的请求。很遗憾，我们暂时无法承接此次搬家。对此造成的不便深表歉意，希望下次能为您服务。\n\n24 Hour Budapest Moving"],confirmed:["您的搬家已确认 – 24 Hour Budapest Moving","{n}，您好！\n\n好消息：您的搬家已确认。我们将按约定时间到达。如有任何变动，请随时联系我们。\n\n24 Hour Budapest Moving"],done:["您的搬家已完成 – 24 Hour Budapest Moving","{n}，您好！\n\n您的搬家已完成。感谢您选择我们，希望一切顺利！\n\n24 Hour Budapest Moving"]}};
function waNum(p){var d=p.replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);else if(d.indexOf("06")===0)d="36"+d.slice(2);return d}
function msgFor(r,st){var x=(M[r.lang]||M.en)[st||r.status]||M.en.new;return[x[0],x[1].replace("{n}",r.name)]}
/* Automatic email to the customer (in their own language) */
async function sendMail(r,st){
 if(!r.email)return"noemail";
 if(EMAILJS_PUBLIC_KEY.indexOf("YOUR_")===0)return"notset";
 var m=msgFor(r,st);
 try{var res=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EMAILJS_SERVICE_ID,template_id:EMAILJS_TEMPLATE_ID,user_id:EMAILJS_PUBLIC_KEY,template_params:{to_email:r.email,to_name:r.name,subject:m[0],message:m[1]}})});
  return res.ok?"sent":"failed"}catch(e){return"failed"}}
async function setStatus(r,s){
 var u=await sb.from("requests").update({status:s}).eq("id",r.id);
 if(u.error){alert("Could not update: "+u.error.message);return}
 var res=await sendMail(r,s);
 toast(res==="sent"?"Status updated · email sent to "+r.email:res==="noemail"?"Status updated · customer left no email":res==="notset"?"Status updated · email not set up yet":"Status updated · email FAILED, use the button on the request");
 load()}
function renderAdmin(){
 var today=new Date().toISOString().slice(0,10);
 $("#sNew").textContent=reqs.filter(function(r){return r.status==="new"}).length;
 $("#sConf").textContent=reqs.filter(function(r){return r.status==="confirmed"}).length;
 $("#sToday").textContent=reqs.filter(function(r){return(r.when||"").indexOf(today)===0&&r.status==="confirmed"}).length;
 $("#chips").innerHTML=["all","new","confirmed","done","declined"].map(function(f){return'<button class="chip" data-f="'+f+'" aria-pressed="'+(filter===f)+'">'+f+'</button>'}).join("");
 $$(".chip").forEach(function(c){c.onclick=function(){filter=c.dataset.f;renderAdmin()}});
 var list=$("#list");list.innerHTML="";var rows=reqs.filter(function(r){return filter==="all"||r.status===filter});
 if(!rows.length){list.innerHTML='<p class="meta">No requests here yet.</p>';return}
 rows.forEach(function(r,i){var el=document.createElement("div");el.className="req";
  el.innerHTML="<h3>"+esc(r.name)+'<span class="badge s-'+esc(r.status)+'">'+esc(r.status)+'</span></h3><div class="meta">'+esc(r.when)+" · "+esc(r.phone)+(r.email?" · "+esc(r.email):"")+(r.ig?" · @"+esc(r.ig):"")+" · "+esc(r.lang)+'</div><p style="margin:8px 0 2px"><b>'+esc(r.from)+"</b> → <b>"+esc(r.to)+"</b>"+(r.abroad?" ("+esc(r.abroad)+")":"")+'</p><div class="meta">'+esc(r.items)+(r.notes?" · "+esc(r.notes):"")+'</div><div class="acts"></div>';
  var a=el.querySelector(".acts");
  function b(txt,cls,fn){var x=document.createElement("button");x.className="btn sm "+cls;x.textContent=txt;x.onclick=fn;a.appendChild(x)}
  function lnk(txt,cls,href,fn){var x=document.createElement("a");x.className="btn sm "+cls;x.textContent=txt;x.href=href;x.target="_blank";x.rel="noopener";if(fn)x.onclick=fn;a.appendChild(x)}
  if(r.status==="new"){b("Confirm","cta",function(){setStatus(r,"confirmed")});b("Decline","ghost",function(){setStatus(r,"declined")})}
  if(r.status==="confirmed")b("Mark done","cta",function(){setStatus(r,"done")});
  if(r.email)b("Resend email","ghost",async function(){var s=await sendMail(r,r.status);toast(s==="sent"?"Email sent to "+r.email:"Email could not be sent")});
  var m=msgFor(r),pref=r.method;
  var opts={w:["WhatsApp","w","https://wa.me/"+waNum(r.phone)+"?text="+encodeURIComponent(m[1])],e:r.email?["Email","em","mailto:"+encodeURIComponent(r.email)+"?subject="+encodeURIComponent(m[0])+"&body="+encodeURIComponent(m[1])]:null,i:r.ig?["Instagram","ig","https://ig.me/m/"+encodeURIComponent(r.ig)]:null};
  ["w","i","e"].sort(function(x,y){return(y===pref)-(x===pref)}).forEach(function(k){var o=opts[k];if(!o)return;
   lnk((k===pref?"★ ":"")+o[0],o[1],o[2],k==="i"?function(){try{navigator.clipboard.writeText(m[1])}catch(e){}}:null)});
  list.appendChild(el)})}

async function load(){
 var r=await sb.from("requests").select("*").order("created_at",{ascending:false});
 if(r.error){var denied=/permission|denied|jwt|401|403/i.test(r.error.message||"");
  if(denied){await sb.auth.signOut();$("#lgErr").textContent="This account does not have access.";return false}
  $("#list").innerHTML='<p class="meta">Could not load requests: '+esc(r.error.message)+'</p>';return true}
 reqs=r.data.map(function(o){o.from=o.from_addr;o.to=o.to_addr;o.when=o.when_text||"";o.abroad=o.abroad||"";return o});
 renderAdmin();return true}
function touch(){if(!$("#v-admin")||$("#v-admin").hidden)return;clearTimeout(idleT);idleT=setTimeout(function(){sb.auth.signOut()},IDLE)}
["click","keydown","touchstart"].forEach(function(e){document.addEventListener(e,touch,{passive:true})});
async function enter(session){
 if(!session){clearInterval(pollT);clearTimeout(idleT);reqs=[];$("#list").innerHTML="";$("#lgP").value="";view(false);return}
 $("#who").textContent="Signed in as "+session.user.email;
 var ok=await load();if(!ok)return;
 view(true);touch();clearInterval(pollT);pollT=setInterval(load,20000)}
$("#lgS").onclick=function(){var p=$("#lgP"),sh=p.type==="password";p.type=sh?"text":"password";this.textContent=sh?"Hide":"Show"};
$("#lgOut").onclick=function(){sb.auth.signOut()};
$("#rf").onclick=load;
$("#lgP").addEventListener("keydown",function(e){if(e.key==="Enter")$("#lgGo").click()});
$("#lgGo").onclick=async function(){var err=$("#lgErr");err.textContent="";
 if(!sb){err.textContent="Setup missing: add the Supabase URL and key at the top of this file.";return}
 if(Date.now()<lockUntil){err.textContent="Too many attempts. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+" seconds.";return}
 var e=$("#lgE").value.trim().toLowerCase(),p=$("#lgP").value;
 var r=await sb.auth.signInWithPassword({email:e,password:p});
 if(!r.error)return; /* onAuthStateChange takes it from here */
 fails++;await new Promise(function(z){setTimeout(z,600+fails*400)});
 if(fails>=5){lockUntil=Date.now()+Math.min(30*60000,60000*Math.pow(2,fails-5));err.textContent="Too many attempts. Locked for a while."}
 else err.textContent="Email or password is not correct."};
if(sb){sb.auth.onAuthStateChange(function(ev,session){if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){setTimeout(function(){enter(session)},0)}})}
else{$("#lgMsg").textContent="Setup missing: add the Supabase URL and anon key at the top of this file."}
})();
</script>
</body>
</html>
