header{background:var(--blue);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.logo{font-weight:900;font-size:1.1rem}.logo b{color:var(--cta)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langs{display:flex;gap:3px;background:rgba(255,255,255,.12);padding:3px;border-radius:999px}
.langs button,nav button{font:inherit;font-weight:700;font-size:.88rem;color:#fff;background:transparent;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--blue)}
nav button{border:2px solid transparent}nav button[aria-selected="true"]{border-color:#fff;background:rgba(255,255,255,.16)}
.hero{background:var(--blue);color:#fff;padding:22px 20px 112px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.9rem,5.5vw,3rem);max-width:660px;position:relative;z-index:1;animation:rise .6s ease both}
.hero p{max-width:560px;color:#C9D6F0;margin:10px 0 0;position:relative;z-index:1;animation:rise .6s .15s ease both}
.qc{position:relative;z-index:1;margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;animation:rise .6s .3s ease both}

.pill.w{background:var(--wa)}.pill.i{background:#C13584}.pill.e{background:var(--blue2);border-color:#5C80C4}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main{max-width:860px;margin:-12px auto 30px;padding:0 16px}

.prog{position:relative;height:8px;background:var(--line);border-radius:99px;margin:6px 4px 30px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--cta);transition:width .5s ease;width:12%}

.tile.on .q{display:grid}

.row{display:flex;gap:8px;margin-top:14px}.row input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}

.pin{position:absolute;bottom:0;font-size:22px}.pin.a{left:10px}.pin.b{right:10px;animation:bounce 1.2s infinite}@keyframes bounce{50%{transform:translateY(-6px)}}
.chk{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:700;margin-bottom:12px}.chk input{width:20px;height:20px}.chk:has(input:checked){border-color:var(--cta);background:rgba(255,122,26,.1)}
.cms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.cm{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-weight:800;cursor:pointer;margin:0;transition:all .2s}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.chip[aria-pressed="true"]{background:var(--blue2);border-color:var(--blue2);color:#fff}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lg{max-width:440px;margin:32px auto}.lg h2{margin-bottom:6px}.lg .steps{display:flex;gap:8px;margin:14px 0 18px;font-size:.82rem;color:var(--mute)}

.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:.82rem;font-weight:700;background:transparent;border:0;color:var(--blue2);cursor:pointer;padding:8px}
.lgbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:.88rem;color:var(--mute)}
</style>

 renderAdmin();return true}
function touch(){if(!$("#v-admin")||$("#v-admin").hidden)return;clearTimeout(idleT);idleT=setTimeout(function(){sb.auth.signOut()},IDLE)}
["click","keydown","touchstart"].forEach(function(e){document.addEventListener(e,touch,{passive:true})});
async function enter(session){
 if(!session){clearInterval(pollT);clearTimeout(idleT);reqs=[];$("#list").innerHTML="";$("#lgP").value="";view(false);return}
 $("#who").textContent="Signed in as "+session.user.email;
 var ok=await load();if(!ok)return;
 view(true);touch();clearInterval(pollT);pollT=setInterval(load,20000)}
$("#lgS").onclick=function(){var p=$("#lgP"),sh=p.type==="password";p.type=sh?"text":"password";this.textContent=sh?"Hide":"Show"};
$("#lgOut").onclick=function(){sb.auth.signOut()};
$("#rf").onclick=load;
$("#lgP").addEventListener("keydown",function(e){if(e.key==="Enter")$("#lgGo").click()});
$("#lgGo").onclick=async function(){var err=$("#lgErr");err.textContent="";
 if(!sb){err.textContent="Setup missing: add the Supabase URL and key at the top of this file.";return}
 if(Date.now()<lockUntil){err.textContent="Too many attempts. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+" seconds.";return}
 var e=$("#lgE").value.trim().toLowerCase(),p=$("#lgP").value;
 var r=await sb.auth.signInWithPassword({email:e,password:p});
 if(!r.error)return; /* onAuthStateChange takes it from here */
 fails++;await new Promise(function(z){setTimeout(z,600+fails*400)});
 if(fails>=5){lockUntil=Date.now()+Math.min(30*60000,60000*Math.pow(2,fails-5));err.textContent="Too many attempts. Locked for a while."}
 else err.textContent="Email or password is not correct."};
if(sb){sb.auth.onAuthStateChange(function(ev,session){if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT"){setTimeout(function(){enter(session)},0)}})}
else{$("#lgMsg").textContent="Setup missing: add the Supabase URL and anon key at the top of this file."}
})();
</script>
